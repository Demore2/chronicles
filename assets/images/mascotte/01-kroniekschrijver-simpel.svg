<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="De Kroniekschrijver">
  <!-- Simplified: quill and hand removed, so the mark is one colour plus a face. -->
  <!-- robe -->
  <path d="M 62 104 C 46 124 34 150 31 172 Q 30 181 40 181 L 160 181 Q 170 181 169 172 C 166 150 154 124 138 104 Z" fill="#3B6E7D"/>
  <!-- hood -->
  <circle cx="100" cy="88" r="52" fill="#3B6E7D"/>
  <!-- face opening -->
  <ellipse cx="100" cy="92" rx="34" ry="35" fill="#F7F1E4"/>
  <!-- eyes -->
  <circle cx="88" cy="90" r="5" fill="#211F1A"/>
  <circle cx="112" cy="90" r="5" fill="#211F1A"/>
  <!-- smile -->
  <path d="M 90 106 Q 100 114 110 106" fill="none" stroke="#211F1A" stroke-width="4.5" stroke-linecap="round"/>
</svg>
