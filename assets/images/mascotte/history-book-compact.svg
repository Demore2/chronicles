<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="History Book">
  <!--
    Small-size variant of history-book-teal.svg, for 28-48 px.
    Same drawing, minus the two details that close up when the mark gets small:
    the outer cover outline (its double line merges with the page line) and the
    clasp (sub-pixel below ~40 px). What is left is scaled up 1.26x to fill the
    space the cover used to take, which also lifts the line weight 32 -> 40.
  -->
  <rect width="1024" height="1024" fill="#3B6E7D"/>
  <g transform="translate(512 512) scale(1.26) translate(-512 -512)">
    <g fill="none" stroke="#F7F1E4" stroke-width="32" stroke-linejoin="miter">
      <path d="M 512 371 C 500 320 420 295 310.5 290 L 310.5 648 C 380 660 450 690 512 711"/>
      <path d="M 512 371 C 524 320 604 295 713.5 290 L 713.5 648 C 644 660 574 690 512 711"/>
    </g>
    <g fill="#F7F1E4">
      <rect x="414" y="382" width="44" height="224"/>
      <rect x="566" y="382" width="44" height="224"/>
      <rect x="414" y="470" width="196" height="40"/>
    </g>
  </g>
</svg>
