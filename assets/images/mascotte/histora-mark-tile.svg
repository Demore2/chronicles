<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Histora">
  <!--
    Full-bleed colourway — the **icon** source, the role history-book-teal.svg used
    to play. Rendered to PNG by scripts/generate-logo.mjs, then fed to
    scripts/derive-icon-variants.mjs, which samples the flat background from the
    corners and rebuilds app-icon / app-icon-adaptive / app-favicon.

    No disc here: a launcher icon is already masked to a circle or squircle, so
    drawing a second circle inside it just shrinks the glyph. The H is scaled up
    to 400x520 for the same reason — at the mark's own proportions it would land
    around a third of the tile and read as a small letter in a big blue square.
  -->
  <rect width="1024" height="1024" fill="#0EA5E9"/>
  <g fill="#FFFFFF">
    <rect x="312" y="252" width="88" height="520"/>
    <rect x="624" y="252" width="88" height="520"/>
    <rect x="312" y="473" width="400" height="78"/>
  </g>
</svg>
