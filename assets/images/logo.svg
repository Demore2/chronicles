<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#D4A574" opacity="0.15"/>

  <!-- Hourglass icon -->
  <g transform="translate(100, 100)">
    <!-- Top chamber -->
    <path d="M -20 -30 L 20 -30 L 0 -5 L -20 -30" fill="#2F5233" opacity="0.8"/>

    <!-- Bottom chamber -->
    <path d="M -20 30 L 20 30 L 0 5 L -20 30" fill="#2F5233" opacity="0.8"/>

    <!-- Sand flowing -->
    <ellipse cx="0" cy="-4" rx="3" ry="2" fill="#A67C52"/>
    <ellipse cx="1" cy="2" rx="2.5" ry="1.5" fill="#A67C52"/>

    <!-- Frame -->
    <rect x="-22" y="-32" width="44" height="64" rx="4" fill="none" stroke="#2F5233" stroke-width="2.5"/>
  </g>

  <!-- App name -->
  <text x="100" y="160" font-family="Georgia, serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#1A1A1A" letter-spacing="2">HISTORY</text>
</svg>
